services:
  weather-model:
    image: ghcr.io/monkeycodeunama/mare-alerta-ia:${IA_IMAGE_TAG:?IA_IMAGE_TAG is required}
    restart: unless-stopped
    environment:
      IA_API_KEY: ${IA_CHUVA_API_KEY:?IA_CHUVA_API_KEY is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mare-alerta-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=mare-alerta-network
      - traefik.http.routers.mare-alerta-ia.rule=Host(`mare-alerta-ia.local`)
      - traefik.http.routers.mare-alerta-ia.entrypoints=web
      - traefik.http.services.mare-alerta-ia.loadbalancer.server.port=8000

networks:
  mare-alerta-network:
    external: true
