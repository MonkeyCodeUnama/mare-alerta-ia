name: Publish ARM64 image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'app.py'
      - 'rain_runtime.py'
      - 'artifacts/**'
      - '.github/workflows/publish-image.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'app.py'
      - 'rain_runtime.py'
      - 'artifacts/**'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/monkeycodeunama/mare-alerta-ia

jobs:
  test:
    name: Testar runtime e modelo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Validar sintaxe
        run: python -m py_compile app.py rain_runtime.py
      - name: Executar testes
        run: python -m pytest -q

  smoke-container:
    name: Smoke test da imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Construir imagem de teste
        run: docker build -t mare-alerta-ia:ci .
      - name: Iniciar container
        run: docker run -d --name mare-alerta-ia-ci -p 8000:8000 -e IA_API_KEY=ci-test-key mare-alerta-ia:ci
      - name: Aguardar healthcheck
        run: |
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs mare-alerta-ia-ci
          exit 1
      - name: Validar autenticação e inferência
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8000/v1/predict \
            -H 'Content-Type: application/json' \
            --data-binary @example_request.json)" = 401
          test "$(curl --silent --output /tmp/prediction.json --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8000/v1/predict \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: ci-test-key' \
            --data-binary @example_request.json)" = 200
          python -c 'import json; body=json.load(open("/tmp/prediction.json")); assert 0 <= body["rain_probability"] <= 1'
      - name: Logs em falha
        if: failure()
        run: docker logs mare-alerta-ia-ci

  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    needs: smoke-container
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mare-alerta-ia-arm64
          cache-to: type=gha,mode=max,scope=mare-alerta-ia-arm64
